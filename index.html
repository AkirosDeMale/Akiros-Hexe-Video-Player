    <h1>Video Player Test</h1>

    <div class="player_local">
        <akiros-hexed-player title="test"></akiros-hexed-player>
    </div>
    <style>
        .player_local {
            width: 50%;
            height: 500px;
        }
    </style>
    <script src="module_ah/js/ah_player.js"></script>

    <hr>

    <h2>Feed</h2>

    <div id="feed"></div>

    <hr>

    <h2>Comments</h2>

    <div id="comments"></div>

    <script src="player.js"></script>

    <script>
    const feed = document.getElementById("feed");
    const comments = document.getElementById("comments");

    const posts = [
        "New episode dropped",
        "Recommended: Episode 2",
        "Trending anime today",
        "Someone said ep 3 is insane",
        "Next update coming soon"
    ];

    let i = 0;

    function renderFeed() {
        feed.innerHTML = "";

        for (let j = 0; j < 3; j++) {
            const div = document.createElement("div");
            div.textContent = posts[(i + j) % posts.length];
            div.onclick = () => {
                i++;
                renderFeed();
            };
            feed.appendChild(div);
        }
    }

    renderFeed();

    // фейк комментарии
    const fakeComments = [
        "bro this is fire",
        "why is episode 2 so good?",
        "animation is crazy",
        "next episode WHEN??",
        "10/10 no cap"
    ];

    fakeComments.forEach(c => {
        const div = document.createElement("div");
        div.textContent = c;
        comments.appendChild(div);
    });
    </script>
